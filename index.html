<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="en" />
    <!-- The app mark, cropped tight. favicon.png is the older 1024×1024 asset
         kept only as a fallback for anything still pointing at it. -->
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- ====================================================================
         GOOGLE SEARCH CONSOLE VERIFICATION
         Search Console → Add property → URL prefix → HTML tag. Paste the
         content value below and republish. This is also a prerequisite for
         verifying the Google OAuth consent screen for digitalstudios.app.
         (The alternative "HTML file" method also works: drop the
         google<hash>.html file Google gives you into public/.)
    ==================================================================== -->
    <!-- <meta name="google-site-verification" content="PASTE_TOKEN_HERE" /> -->

    <!-- Description is kept under ~160 chars so Google shows it whole rather
         than truncating mid-sentence. Per-route overrides live in
         src/lib/seo.js (useSeo); these are the crawl-time defaults. -->
    <meta name="description" content="Create feature-length AI movies with scenes, music, subtitles and dubbing. Generate images and songs, and dub any video into any language — one AI studio." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Digital Studio" />
    <link rel="canonical" href="https://digitalstudios.app/" />

    <meta property="og:site_name" content="Digital Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digitalstudios.app/" />
    <meta property="og:title" content="Digital Studio — One AI Studio for Every Creator" />
    <meta property="og:description" content="AI movies with scenes, music, subtitles and dubbing. Generate images and songs. Dub any video into any language. Start free." />
    <!-- Horizontal lockup reads best in a link preview card. -->
    <meta property="og:image" content="https://digitalstudios.app/brand/lockup-h.png" />
    <meta property="og:image:alt" content="Digital Studio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Studio — One AI Studio for Every Creator" />
    <meta name="twitter:description" content="AI movies with scenes, music, subtitles and dubbing. Generate images and songs. Dub any video into any language. Start free." />
    <meta name="twitter:image" content="https://digitalstudios.app/brand/lockup-h.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="preconnect" href="https://base44.app" />

    <!-- Title pattern: primary keyword first, brand last. Under 60 chars so
         it isn't truncated in results. -->
    <title>Digital Studio — AI Movie, Music &amp; Dubbing Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
